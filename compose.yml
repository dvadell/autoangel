services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: autoangel
      POSTGRES_PASSWORD: autoangel
      POSTGRES_DB: autoangel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./docker/timescaledb/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoangel -d autoangel"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  timescaledb_data:
